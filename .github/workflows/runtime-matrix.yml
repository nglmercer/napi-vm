name: Runtime compatibility
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # N-API 8 is stable across Node versions: compile once per OS/architecture,
  # then load the exact same CJS/ESM addon on every supported Node version.
  build:
    name: Build and Rust checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Configure fast linkers and Rust cache
        uses: ./.github/actions/setup-build
        with:
          cache-group: runtime
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Select Node headers for native addon fixtures
        if: runner.os != 'Windows'
        run: node tools/ci/node-headers.cjs
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - run: npm ci --ignore-scripts
      - name: Build CJS and ESM addon without unrelated binaries
        run: node tools/ci/build-bindings.mjs
      - name: Check generated sources without rebuilding
        run: git diff --exit-code -- index.js index.mjs index.d.ts
      # The fixture is built offline by tests and has its own lockfile.
      - name: Fetch napi-rs fixture dependencies
        run: cargo fetch --locked --manifest-path tests/fixtures/node-api/napi-rs/Cargo.toml
      - name: Feature combinations and lint
        shell: bash
        run: |
          cargo test --profile ci --locked
          cargo test --workspace --profile ci --locked --all-features
          cargo test --profile ci --locked --no-default-features
          cargo test -p napi-vm-core --profile ci --locked --no-default-features
          cargo test -p napi-vm-runtime --profile ci --locked --no-default-features --features runtime
          npm run lint
      - name: Serialized memory regression
        if: matrix.os == 'ubuntu-24.04'
        run: cargo test --profile ci --locked --no-default-features --test compiler_memory -- --test-threads=1
      - name: Upload native addon and generated loaders
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runtime-native-${{ matrix.os }}
          path: |
            *.node
            index.js
            index.mjs
            index.d.ts
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
  native:
    name: Runtime (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025, windows-11-arm]
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - name: Download addon for this platform
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: runtime-native-${{ matrix.os }}
      - run: npm ci --ignore-scripts
      # npm test already runs test:node; do not execute it twice. Browser tests
      # are exercised by CI's dedicated, built WASM package rather than skipped.
      - name: Bun and Node runtime tests
        shell: bash
        run: |
          bun test ./tests --path-ignore-patterns '**/{node,wasm}/**'
          npm run test:node
  focused-miri:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: nightly
          components: miri
      - name: Cache nightly Rust artifacts
        uses: ./.github/actions/setup-build
        with:
          cache-group: miri
          native-linkers: 'false'
      - run: cargo miri setup
      - run: cargo miri test --no-default-features --lib shape::tests
      - name: Production owner gate migration without Node FFI
        run: cargo miri test --no-default-features --features napi --lib owner_migration
      - name: Export failure rollback without Node FFI
        run: cargo miri test --no-default-features --features napi --lib failed_export_setup
