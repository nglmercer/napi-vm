name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Quality gate ──────────────────────────────────────────────────────
  #
  # Formatting, lints and type-checking run first and on their own, so a PR
  # fails on them in ~1 minute rather than surfacing at release-tagging time.
  quality:
    name: Lint and type-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate all GitHub workflows
        run: bash tools/ci/lint-workflows.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Configure fast linkers and Rust cache
        uses: ./.github/actions/setup-build
        with:
          cache-group: quality

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # `plugins/` implements the filesystem permission checks. Type errors
      # there are security-relevant, so the compiler is a required gate.
      - name: tsc --noEmit
        run: npm run lint:ts

  # ── Generated bindings ────────────────────────────────────────────────
  #
  # `index.js`, `index.mjs` and `index.d.ts` are build outputs that are also
  # committed. Without this check they drift: the tree has shipped an
  # `index.js` pinned to one version, an `index.mjs` pinned to another, and a
  # zero-byte `index.d.ts` while `package.json` advertised it as the typings.
  # ── Browser build ─────────────────────────────────────────────────────
  #
  # The playground imports `/pkg/napi_vm.js`, which `wasm-pack` generates — so
  # its types only exist once that package is built. Type-checking it in the
  # quality job (which does not build it) could never pass; this job builds the
  # package first, then type-checks and runs the browser suite against it.
  #
  # The two targets compile different code — generators especially — so a
  # change that passes everything else can still break the playground.
  playground:
    name: Browser build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown

      - name: Configure fast linkers and Rust cache
        uses: ./.github/actions/setup-build
        with:
          cache-group: wasm

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Download the pinned binary instead of compiling its CLI dependencies.
      - name: Install prebuilt wasm-pack
        uses: ./.github/actions/setup-wasm-pack

      # Builds the package, type-checks the playground against it, then runs
      # the browser suite under Node.
      - name: Build, type-check and test the browser package
        run: npm run test:wasm

  generated:
    name: Generated bindings are current
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.1
          targets: x86_64-unknown-linux-gnu

      - name: Configure fast linkers and Rust cache
        uses: ./.github/actions/setup-build
        with:
          cache-group: native

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Regenerate and diff
        run: |
          node tools/ci/build-bindings.mjs
          if ! git diff --exit-code -- index.js index.mjs index.d.ts; then
            echo "::error::Generated bindings are stale. Run 'npm run build:all' and commit the result."
            exit 1
          fi

  # ── Linux x86_64 ──────────────────────────────────────────────────────
  linux-x64:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.1
          targets: x86_64-unknown-linux-gnu

      - name: Configure fast linkers and Rust cache
        uses: ./.github/actions/setup-build

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native module
        run: npx napi build --platform --release -- --lib --locked

      - name: Verify Rust napi-rs plugin host without Node at runtime
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          examples/plugins/rust-napi-plugin/build-and-run.sh

          plugin_dir="$PWD/examples/plugins/rust-napi-plugin"
          addon="$plugin_dir/node_modules/rust-napi-plugin.node/build/Release/addon.node"
          digest="$(sha256sum "$addon" | cut -d ' ' -f 1)"
          env -i PATH=/nonexistent TMPDIR="$TMPDIR" \
            "$PWD/target/debug/examples/rust-plugin-napi" \
            "$plugin_dir" "$addon" "$digest"

      # These two run first and single-threaded: generators run on their own
      # stacks via stack-switching, and a fault there aborts the whole test
      # process. On one thread the harness names the test that died instead of
      # leaving an interleaved log.
      #
      # The backend suite comes first because it drives `corosensei` directly,
      # with no interpreter in the way. If it faults, the bug is in the
      # stack-switching backend; if it passes and the stress suite faults, the
      # bug is in this crate's teardown. Without it the two are
      # indistinguishable from a `STATUS_ACCESS_VIOLATION` and an exit code.
      - name: Run coroutine backend suite (deterministic)
        run: cargo test --profile ci-optimized --locked --no-default-features --test coroutine_backend -- --test-threads=1 --nocapture

      - name: Run generator stress suite (deterministic)
        run: cargo test --profile ci-optimized --locked --no-default-features --test generator_stress -- --test-threads=1 --nocapture

      - name: Run Rust tests (full)
        run: cargo test --profile ci --locked

      - name: Run Rust tests (core only, no NAPI)
        run: cargo test --profile ci --locked --no-default-features

      - name: Build and test optimized napi-vm-lsp
        run: cargo test --profile ci-optimized --locked --no-default-features --test lsp_protocol

      - name: Verify LSP binary speaks LSP
        run: |
          set -euo pipefail
          frame() {
            printf 'Content-Length: %s\r\n\r\n%s' "$(printf '%s' "$1" | wc -c)" "$1"
          }
          INIT='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"rootUri":"file:///tmp","capabilities":{}}}'
          SHUTDOWN='{"jsonrpc":"2.0","id":2,"method":"shutdown","params":{}}'
          EXIT='{"jsonrpc":"2.0","method":"exit","params":{}}'

          OUTPUT="$( { frame "$INIT"; frame "$SHUTDOWN"; frame "$EXIT"; } \
            | ./target/ci-optimized/napi-vm-lsp )"
          echo "$OUTPUT" | grep -q '"name":"napi-vm-lsp"'
          echo "$OUTPUT" | grep -q 'Content-Length:'

          # exit after shutdown -> 0
          { frame "$INIT"; frame "$SHUTDOWN"; frame "$EXIT"; } | ./target/ci-optimized/napi-vm-lsp > /dev/null
          # exit without shutdown -> 1
          set +e
          { frame "$INIT"; frame "$EXIT"; } | ./target/ci-optimized/napi-vm-lsp > /dev/null
          code=$?
          set -e
          test "$code" -eq 1

      - name: Build Zed extension (wasm32-wasip2)
        run: |
          rustup target add wasm32-wasip2
          cargo build --manifest-path zed-extension/Cargo.toml --target wasm32-wasip2 --release

      - name: Run JS tests
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # `vendor/rdev-node` carries its own upstream suite whose native binding
      # is not built here (its `.node` files are gitignored build outputs), so
      # an unscoped `bun test` fails on a fresh checkout while looking for
      # them. (A positional `tests/` filter does not work: bun matches it as
      # a substring, which still matches `vendor/rdev-node/tests/`.)
      - run: bun test ./tests --path-ignore-patterns '**/{node,wasm}/**'

      - name: Upload .node artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: napi-vm-linux-x64
          path: "*.node"

      - name: Upload LSP artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: napi-vm-lsp-linux-x64
          path: target/ci-optimized/napi-vm-lsp
          if-no-files-found: error

  # ── Linux aarch64 ─────────────────────────────────────────────────────
  linux-arm64:
    name: Linux aarch64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.1
          targets: aarch64-unknown-linux-gnu

      - name: Configure fast linkers and Rust cache
        uses: ./.github/actions/setup-build

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native module
        run: npx napi build --platform --release -- --lib --locked

      - name: Run Rust tests (core only, no NAPI)
        run: cargo test --profile ci --locked --no-default-features

      - name: Build and test optimized napi-vm-lsp
        run: cargo test --profile ci-optimized --locked --no-default-features --test lsp_protocol

      - name: Upload .node artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: napi-vm-linux-arm64
          path: "*.node"

  # ── macOS aarch64 (Apple Silicon) ─────────────────────────────────────
  darwin-arm64:
    name: macOS aarch64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-darwin

      - name: Configure fast linkers and Rust cache
        uses: ./.github/actions/setup-build

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native module
        run: npx napi build --platform --release -- --lib --locked

      - name: Run Rust tests (core only, no NAPI)
        run: cargo test --profile ci --locked --no-default-features

      - name: Build and test optimized napi-vm-lsp
        run: cargo test --profile ci-optimized --locked --no-default-features --test lsp_protocol

      - name: Upload .node artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: napi-vm-darwin-arm64
          path: "*.node"

  # ── macOS x86_64 ──────────────────────────────────────────────────────
  darwin-x64:
    name: macOS x86_64
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.1
          targets: x86_64-apple-darwin

      - name: Configure fast linkers and Rust cache
        uses: ./.github/actions/setup-build

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native module
        run: npx napi build --platform --release -- --lib --locked

      - name: Run Rust tests (core only, no NAPI)
        run: cargo test --profile ci --locked --no-default-features

      - name: Build and test optimized napi-vm-lsp
        run: cargo test --profile ci-optimized --locked --no-default-features --test lsp_protocol

      - name: Upload .node artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: napi-vm-darwin-x64
          path: "*.node"

  # ── Windows x86_64 ────────────────────────────────────────────────────
  win-x64:
    name: Windows x86_64
    runs-on: windows-2025
    # ci-optimized emits line tables for debugger crash reports, without
    # forcing PDBs onto the separately built release addon.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc

      - name: Configure fast linkers and Rust cache
        uses: ./.github/actions/setup-build

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native module
        run: npx napi build --platform --release -- --lib --locked

      # These two run first and single-threaded: generators run on their own
      # stacks via stack-switching, and a fault there aborts the whole test
      # process. On one thread the harness names the test that died instead of
      # leaving an interleaved log.
      #
      # The backend suite comes first because it drives `corosensei` directly,
      # with no interpreter in the way. If it faults, the bug is in the
      # stack-switching backend; if it passes and the stress suite faults, the
      # bug is in this crate's teardown. Without it the two are
      # indistinguishable from a `STATUS_ACCESS_VIOLATION` and an exit code.
      - name: Run coroutine backend suite (deterministic)
        run: cargo test --profile ci-optimized --locked --no-default-features --test coroutine_backend -- --test-threads=1 --nocapture

      - name: Run generator stress suite (deterministic)
        run: cargo test --profile ci-optimized --locked --no-default-features --test generator_stress -- --test-threads=1 --nocapture

      # A `STATUS_ACCESS_VIOLATION` is not a Rust panic: no backtrace, no
      # message, just an exit code. Re-run the same binary under `cdb` (the
      # Windows SDK debugger, preinstalled on the runner image) to get the
      # faulting instruction and the stack that reached it. `line-tables-only`
      # debug info in ci-optimized is what makes those frames readable.
      #
      # Diagnostic only -- it never changes the job's verdict, and it is a
      # no-op once the suite is green.
      - name: Capture the faulting stack
        if: failure()
        shell: pwsh
        run: |
          $exe = (cargo test --profile ci-optimized --locked --no-default-features --test generator_stress --no-run --message-format=json |
                  ForEach-Object { $_ | ConvertFrom-Json } |
                  Where-Object { $_.reason -eq 'compiler-artifact' -and $_.executable } |
                  Select-Object -Last 1).executable
          Write-Host "test binary: $exe"

          $cdb = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe' -EA SilentlyContinue
          if (-not $cdb) {
            Write-Host '::warning::cdb.exe not found on this image; no stack captured.'
            exit 0
          }

          # -g/-G skip the loader and process-exit breakpoints, so the only
          # break is the fault itself. `kP 100` prints it with arguments.
          & $cdb.FullName -g -G -c '.echo ===RUNNING===; g; .echo ===FAULT===; r; .echo ===ANALYZE===; !analyze -v; .echo ===STACK===; kP 100; q' `
            $exe --test-threads=1 --nocapture 2>&1 | Select-Object -Last 220
          exit 0

      - name: Run Rust tests (full)
        run: cargo test --profile ci --locked

      - name: Run Rust tests (core only, no NAPI)
        run: cargo test --profile ci --locked --no-default-features

      - name: Build and test optimized napi-vm-lsp
        run: cargo test --profile ci-optimized --locked --no-default-features --test lsp_protocol

      - name: Upload .node artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: napi-vm-win-x64
          path: "*.node"

      - name: Upload LSP artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: napi-vm-lsp-win-x64
          path: target/ci-optimized/napi-vm-lsp.exe
          if-no-files-found: error

  # ── Windows aarch64 ───────────────────────────────────────────────────
  win-arm64:
    name: Windows aarch64
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.1
          targets: aarch64-pc-windows-msvc

      - name: Configure fast linkers and Rust cache
        uses: ./.github/actions/setup-build

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Native build on the arm64 runner (previously cross-compiled from
      # x64): `--platform` already resolves to aarch64-pc-windows-msvc here.
      - name: Build native module
        run: npx napi build --platform --release -- --lib --locked

      - name: Build and test optimized napi-vm-lsp
        run: cargo test --profile ci-optimized --locked --no-default-features --test lsp_protocol

      - name: Upload .node artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: napi-vm-win-arm64
          path: "*.node"

  # ── macOS in-process Node-API host ────────────────────────────────────
  macos-node-api-host:
    name: macOS Node-API host (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}

      - name: Configure fast linkers and Rust cache
        uses: ./.github/actions/setup-build
        with:
          cache-group: node-api-host

      - name: Build and test macOS Node-API loading
        # These are native runners; tests and the example share target/ci.
        run: |
          fixture="$RUNNER_TEMP/fixture.node"
          cc -std=c11 -O2 -fPIC -dynamiclib -undefined dynamic_lookup tests/fixtures/node-api/node-api-smoke.c -o "$fixture"
          NAPI_VM_MACOS_NODE_API_FIXTURE="$fixture" cargo test --profile ci --locked --no-default-features --features node-api-host --lib macos_tests:: -- --test-threads=1

      - name: Fetch napi-rs fixture dependencies
        run: cargo fetch --locked --manifest-path tests/fixtures/node-api/napi-rs/Cargo.toml

      - name: Differential-test Rust napi-rs plugins
        run: cargo test --profile ci --locked --no-default-features --features node-api-host --lib napi_rs -- --test-threads=1

      - name: Run the Rust plugin host with a Rust napi-rs addon
        env:
          NAPI_VM_HOST_PROFILE: ci
        run: examples/plugins/rust-napi-plugin/build-and-run.sh

  # ── Windows in-process Node-API host ──────────────────────────────────
  windows-node-api-host:
    name: Windows Node-API host (MSVC)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc

      - name: Configure fast linkers and Rust cache
        uses: ./.github/actions/setup-build
        with:
          cache-group: node-api-host

      - name: Test in-process Node-API loading (MSVC)
        env:
          NAPI_VM_HOST_PROFILE: ci
        shell: pwsh
        run: |
          # Compile the test host once to produce node.lib, then run that same
          # binary after linking the fixture instead of building a release host.
          cargo test --profile ci --locked --no-default-features --features node-api-host --lib --no-run
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not build the in-process Node-API host.'
          }

          $importLibrary = Get-ChildItem 'target/ci/build/napi-vm-*/out/node.lib' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $importLibrary) {
            throw 'The Node-API host did not produce node.lib.'
          }

          $fixture = Join-Path $env:RUNNER_TEMP 'fixture.node'
          $object = Join-Path $env:RUNNER_TEMP 'node-api-smoke.obj'
          & cl.exe /nologo /O2 /LD tests/fixtures/node-api/node-api-smoke.c "/Fo$object" /link "/LIBPATH:$($importLibrary.DirectoryName)" node.lib "/OUT:$fixture"
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not link the Windows Node-API smoke addon.'
          }

          $env:NAPI_VM_WINDOWS_NODE_API_FIXTURE = $fixture
          cargo test --profile ci --locked --no-default-features --features node-api-host --lib windows_tests:: -- --test-threads=1
          if ($LASTEXITCODE -ne 0) {
            throw 'The in-process Node-API host tests failed under MSVC.'
          }

          cargo fetch --locked --manifest-path tests/fixtures/node-api/napi-rs/Cargo.toml
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not fetch the napi-rs compatibility fixture dependencies.'
          }

          cargo test --profile ci --locked --no-default-features --features node-api-host --lib napi_rs -- --test-threads=1
          if ($LASTEXITCODE -ne 0) {
            throw 'The Rust napi-rs addon compatibility tests failed under MSVC.'
          }

          & examples/plugins/rust-napi-plugin/build-and-run.ps1
          if ($LASTEXITCODE -ne 0) {
            throw 'The Rust plugin host example failed under MSVC.'
          }

  # ── Node.js compatibility matrix ──────────────────────────────────────
  #
  # The main JS suite runs under Bun, which has its own module loader and
  # native-addon implementation. That leaves `engines.node` unverified: the
  # package claimed Node >=16 while nothing ever loaded it under any Node.
  # This is a small boundary suite, not the full language suite -- enough to
  # catch native loading, CJS/ESM entry points, marshalling and process-exit
  # behaviour on every supported version.
  node-compat:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    needs: linux-x64
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with `engines.node` in package.json.
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Download the native module built by linux-x64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: napi-vm-linux-x64

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Node compatibility tests
        run: npm run test:node
