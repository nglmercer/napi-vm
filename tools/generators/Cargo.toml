[package]
name = "napi-vm-generators"
version = "0.1.0"
edition = "2024"
publish = false
description = "Offline generators for committed Unicode, CLDR and IANA tables"

[[bin]]
name = "tz-data"
path = "src/bin/tz_data.rs"

[dependencies]
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
serde_json = "1"
regex = "1"
roxmltree = "0.20"
sha2 = "0.10"

[[bin]]
name = "number-data"
path = "src/bin/number_data.rs"

[[bin]]
name = "emoji-tables"
path = "src/bin/emoji_tables.rs"

[[bin]]
name = "rgi-check"
path = "src/bin/rgi_check.rs"

[[bin]]
name = "locale-data"
path = "src/bin/locale_data.rs"
