[package]
authors = ["nglmercer <nglmercer@gmail.com>"]
edition = "2021"
name    = "rdev-node"
version = "1.0.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
napi        = { version = "3.13.0", features = ["napi9", "async"] }
napi-derive = "3.6.9"
once_cell   = "1.21"
rdev        = "0.5.3"
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"

[build-dependencies]
napi-build = "2.5.0"

[profile.release]
lto = true
