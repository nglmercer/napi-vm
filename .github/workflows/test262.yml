name: Full Test262 conformance

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: test262-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.98.1
      - name: Configure fast linkers and Rust cache
        uses: ./.github/actions/setup-build
        with:
          cache-group: test262
      - name: Build isolated worker and Test262 tool
        run: |
          cargo build --release --locked --no-default-features --bin napi-vm-test262
          cargo build --release --locked -p napi-vm-test262-runner
      - name: Fetch pinned corpus
        run: target/release/test262 fetch
      - name: Run all variants without feature skips
        run: |
          mkdir -p artifacts/test262
          target/release/test262 run --jobs 2 --timeout 10 \
            --output artifacts/test262/full-results.json
      - name: Summarize results
        if: always()
        run: |
          if test -f artifacts/test262/full-results.json; then
            target/release/test262 summary artifacts/test262/full-results.json \
              --json artifacts/test262/summary.json --show 1000
          fi
      - name: Upload results even when conformance fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test262-${{ github.sha }}
          path: artifacts/test262/
          if-no-files-found: warn
