name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Quality gate ──────────────────────────────────────────────────────
  #
  # Formatting, lints and type-checking run first and on their own, so a PR
  # fails on them in ~1 minute rather than surfacing at release-tagging time.
  quality:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # v1.2.0
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-quality-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # `plugins/` implements the filesystem permission checks. Type errors
      # there are security-relevant, so the compiler is a required gate.
      - name: tsc --noEmit
        run: npm run lint:ts

  # ── Generated bindings ────────────────────────────────────────────────
  #
  # `index.js`, `index.mjs` and `index.d.ts` are build outputs that are also
  # committed. Without this check they drift: the tree has shipped an
  # `index.js` pinned to one version, an `index.mjs` pinned to another, and a
  # zero-byte `index.d.ts` while `package.json` advertised it as the typings.
  # ── Browser build ─────────────────────────────────────────────────────
  #
  # The playground imports `/pkg/napi_vm.js`, which `wasm-pack` generates — so
  # its types only exist once that package is built. Type-checking it in the
  # quality job (which does not build it) could never pass; this job builds the
  # package first, then type-checks and runs the browser suite against it.
  #
  # The two targets compile different code — generators especially — so a
  # change that passes everything else can still break the playground.
  playground:
    name: Browser build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # v1.2.0
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-playground-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Pinned and from crates.io, matching how the rest of this workflow
      # pins its actions. The cargo cache above keeps the rebuild off the
      # critical path after the first run.
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.15.0

      # Builds the package, type-checks the playground against it, then runs
      # the browser suite under Node.
      - name: Build, type-check and test the browser package
        run: npm run test:wasm

  generated:
    name: Generated bindings are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # v1.2.0
        with:
          toolchain: 1.96.0
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-x64-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Regenerate and diff
        run: |
          npx napi build --platform --release --esm --js index.mjs
          npx napi build --platform --release --js index.js
          if ! git diff --exit-code -- index.js index.mjs index.d.ts; then
            echo "::error::Generated bindings are stale. Run 'npm run build:all' and commit the result."
            exit 1
          fi

  # ── Linux x86_64 ──────────────────────────────────────────────────────
  linux-x64:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # v1.2.0
        with:
          toolchain: 1.96.0
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-x64-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native module
        run: npx napi build --platform --release

      # These two run first and single-threaded: generators run on their own
      # stacks via stack-switching, and a fault there aborts the whole test
      # process. On one thread the harness names the test that died instead of
      # leaving an interleaved log.
      #
      # The backend suite comes first because it drives `corosensei` directly,
      # with no interpreter in the way. If it faults, the bug is in the
      # stack-switching backend; if it passes and the stress suite faults, the
      # bug is in this crate's teardown. Without it the two are
      # indistinguishable from a `STATUS_ACCESS_VIOLATION` and an exit code.
      - name: Run coroutine backend suite (deterministic)
        run: cargo test --release --test coroutine_backend -- --test-threads=1 --nocapture

      - name: Run generator stress suite (deterministic)
        run: cargo test --release --test generator_stress -- --test-threads=1 --nocapture

      # A `STATUS_ACCESS_VIOLATION` is not a Rust panic: no backtrace, no
      # message, just an exit code. Re-run the same binary under `cdb` (the
      # Windows SDK debugger, preinstalled on the runner image) to get the
      # faulting instruction and the stack that reached it. `line-tables-only`
      # debug info above is what makes those frames readable.
      #
      # Diagnostic only -- it never changes the job's verdict, and it is a
      # no-op once the suite is green.
      - name: Capture the faulting stack
        if: failure()
        shell: pwsh
        run: |
          $exe = (cargo test --release --test generator_stress --no-run --message-format=json |
                  ForEach-Object { $_ | ConvertFrom-Json } |
                  Where-Object { $_.reason -eq 'compiler-artifact' -and $_.executable } |
                  Select-Object -Last 1).executable
          Write-Host "test binary: $exe"

          $cdb = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe' -EA SilentlyContinue
          if (-not $cdb) {
            Write-Host '::warning::cdb.exe not found on this image; no stack captured.'
            exit 0
          }

          # -g/-G skip the loader and process-exit breakpoints, so the only
          # break is the fault itself. `kP 100` prints it with arguments.
          & $cdb.FullName -g -G -c '.echo ===RUNNING===; g; .echo ===FAULT===; r; .echo ===ANALYZE===; !analyze -v; .echo ===STACK===; kP 100; q' `
            $exe --test-threads=1 --nocapture 2>&1 | Select-Object -Last 220
          exit 0

      - name: Run Rust tests (full)
        run: cargo test --release

      - name: Run Rust tests (core only, no NAPI)
        run: cargo test --release --no-default-features

      - name: Build napi-vm-lsp (no-default-features)
        run: cargo build --release --no-default-features --bin napi-vm-lsp

      - name: Verify LSP binary speaks LSP
        run: |
          set -euo pipefail
          frame() {
            printf 'Content-Length: %s\r\n\r\n%s' "$(printf '%s' "$1" | wc -c)" "$1"
          }
          INIT='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"rootUri":"file:///tmp","capabilities":{}}}'
          SHUTDOWN='{"jsonrpc":"2.0","id":2,"method":"shutdown","params":{}}'
          EXIT='{"jsonrpc":"2.0","method":"exit","params":{}}'

          OUTPUT="$( { frame "$INIT"; frame "$SHUTDOWN"; frame "$EXIT"; } \
            | ./target/release/napi-vm-lsp )"
          echo "$OUTPUT" | grep -q '"name":"napi-vm-lsp"'
          echo "$OUTPUT" | grep -q 'Content-Length:'

          # exit after shutdown -> 0
          { frame "$INIT"; frame "$SHUTDOWN"; frame "$EXIT"; } | ./target/release/napi-vm-lsp > /dev/null
          # exit without shutdown -> 1
          set +e
          { frame "$INIT"; frame "$EXIT"; } | ./target/release/napi-vm-lsp > /dev/null
          code=$?
          set -e
          test "$code" -eq 1

      - name: Build Zed extension (wasm32-wasip2)
        run: |
          rustup target add wasm32-wasip2
          cargo build --manifest-path zed-extension/Cargo.toml --target wasm32-wasip2 --release

      - name: Run JS tests
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun test

      - name: Upload .node artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: napi-vm-linux-x64
          path: "*.node"

      - name: Upload LSP artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: napi-vm-lsp-linux-x64
          path: target/release/napi-vm-lsp

  # ── Linux aarch64 ─────────────────────────────────────────────────────
  linux-arm64:
    name: Linux aarch64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # v1.2.0
        with:
          toolchain: 1.96.0
          targets: aarch64-unknown-linux-gnu

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-arm64-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native module
        run: npx napi build --platform --release

      - name: Run Rust tests (core only, no NAPI)
        run: cargo test --release --no-default-features

      - name: Build napi-vm-lsp (no-default-features)
        run: cargo build --release --no-default-features --bin napi-vm-lsp

      - name: Upload .node artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: napi-vm-linux-arm64
          path: "*.node"

  # ── macOS aarch64 (Apple Silicon) ─────────────────────────────────────
  darwin-arm64:
    name: macOS aarch64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # v1.2.0
        with:
          toolchain: 1.96.0
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-arm64-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native module
        run: npx napi build --platform --release

      - name: Run Rust tests (core only, no NAPI)
        run: cargo test --release --no-default-features

      - name: Build napi-vm-lsp (no-default-features)
        run: cargo build --release --no-default-features --bin napi-vm-lsp

      - name: Upload .node artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: napi-vm-darwin-arm64
          path: "*.node"

  # ── macOS x86_64 ──────────────────────────────────────────────────────
  darwin-x64:
    name: macOS x86_64
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # v1.2.0
        with:
          toolchain: 1.96.0
          targets: x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-x64-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native module
        run: npx napi build --platform --release

      - name: Run Rust tests (core only, no NAPI)
        run: cargo test --release --no-default-features

      - name: Build napi-vm-lsp (no-default-features)
        run: cargo build --release --no-default-features --bin napi-vm-lsp

      - name: Upload .node artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: napi-vm-darwin-x64
          path: "*.node"

  # ── Windows x86_64 ────────────────────────────────────────────────────
  win-x64:
    name: Windows x86_64
    runs-on: windows-latest
    # Emit PDBs for the release build. `line-tables-only` is the cheap tier --
    # enough for a debugger to name frames in the crash captured below, without
    # the build-time cost of full debug info.
    env:
      CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # v1.2.0
        with:
          toolchain: 1.96.0
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-x64-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native module
        run: npx napi build --platform --release

      # These two run first and single-threaded: generators run on their own
      # stacks via stack-switching, and a fault there aborts the whole test
      # process. On one thread the harness names the test that died instead of
      # leaving an interleaved log.
      #
      # The backend suite comes first because it drives `corosensei` directly,
      # with no interpreter in the way. If it faults, the bug is in the
      # stack-switching backend; if it passes and the stress suite faults, the
      # bug is in this crate's teardown. Without it the two are
      # indistinguishable from a `STATUS_ACCESS_VIOLATION` and an exit code.
      - name: Run coroutine backend suite (deterministic)
        run: cargo test --release --test coroutine_backend -- --test-threads=1 --nocapture

      - name: Run generator stress suite (deterministic)
        run: cargo test --release --test generator_stress -- --test-threads=1 --nocapture

      # A `STATUS_ACCESS_VIOLATION` is not a Rust panic: no backtrace, no
      # message, just an exit code. Re-run the same binary under `cdb` (the
      # Windows SDK debugger, preinstalled on the runner image) to get the
      # faulting instruction and the stack that reached it. `line-tables-only`
      # debug info above is what makes those frames readable.
      #
      # Diagnostic only -- it never changes the job's verdict, and it is a
      # no-op once the suite is green.
      - name: Capture the faulting stack
        if: failure()
        shell: pwsh
        run: |
          $exe = (cargo test --release --test generator_stress --no-run --message-format=json |
                  ForEach-Object { $_ | ConvertFrom-Json } |
                  Where-Object { $_.reason -eq 'compiler-artifact' -and $_.executable } |
                  Select-Object -Last 1).executable
          Write-Host "test binary: $exe"

          $cdb = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe' -EA SilentlyContinue
          if (-not $cdb) {
            Write-Host '::warning::cdb.exe not found on this image; no stack captured.'
            exit 0
          }

          # -g/-G skip the loader and process-exit breakpoints, so the only
          # break is the fault itself. `kP 100` prints it with arguments.
          & $cdb.FullName -g -G -c '.echo ===RUNNING===; g; .echo ===FAULT===; r; .echo ===ANALYZE===; !analyze -v; .echo ===STACK===; kP 100; q' `
            $exe --test-threads=1 --nocapture 2>&1 | Select-Object -Last 220
          exit 0

      - name: Run Rust tests (full)
        run: cargo test --release

      - name: Run Rust tests (core only, no NAPI)
        run: cargo test --release --no-default-features

      - name: Build napi-vm-lsp (no-default-features)
        run: cargo build --release --no-default-features --bin napi-vm-lsp

      - name: Upload .node artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: napi-vm-win-x64
          path: "*.node"

      - name: Upload LSP artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: napi-vm-lsp-win-x64
          path: target/release/napi-vm-lsp.exe

  # ── Windows aarch64 ───────────────────────────────────────────────────
  win-arm64:
    name: Windows aarch64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # v1.2.0
        with:
          toolchain: 1.96.0
          targets: aarch64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-arm64-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native module (cross-compile to arm64)
        run: npx napi build --platform --release --target aarch64-pc-windows-msvc

      - name: Build napi-vm-lsp (cross-compile, no-default-features)
        run: cargo build --release --no-default-features --bin napi-vm-lsp --target aarch64-pc-windows-msvc

      - name: Upload .node artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: napi-vm-win-arm64
          path: "*.node"

  # ── Node.js compatibility matrix ──────────────────────────────────────
  #
  # The main JS suite runs under Bun, which has its own module loader and
  # native-addon implementation. That leaves `engines.node` unverified: the
  # package claimed Node >=16 while nothing ever loaded it under any Node.
  # This is a small boundary suite, not the full language suite -- enough to
  # catch native loading, CJS/ESM entry points, marshalling and process-exit
  # behaviour on every supported version.
  node-compat:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    needs: linux-x64
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with `engines.node` in package.json.
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Download the native module built by linux-x64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: napi-vm-linux-x64

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Node compatibility tests
        run: npm run test:node
